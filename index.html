<!-- =================================================
     HERO
================================================== -->

<section class="hero-section">

    <!-- =============================================
         NEW WEDDING INTRO DESIGN
         अपनी photo का नाम नीचे बदल सकते हैं
         wedding-couple-photo.jpeg
    ============================================== -->

    <div class="wedding-intro-design">

        <!-- Decorative flowers -->
        <div class="intro-top-decoration">

            <span class="intro-flower-left">❀</span>

            <span class="intro-flower-right">❀</span>

        </div>


        <!-- Ganesh / Om decoration -->

        <div class="intro-ganesh">

            <span class="ganesh-decoration-line"></span>

            <span class="ganesh-symbol">
                ॐ
            </span>

            <span class="ganesh-decoration-line"></span>

        </div>


        <div class="intro-ganesh-text">
            ॥ SHRI GANESHAYA NAMAH ॥
        </div>


        <!-- Invitation text -->

        <div class="intro-invite-text">
            YOU ARE INVITED TO THE WEDDING OF
        </div>


        <!-- =========================================
             PHOTO FRAME

             अपनी photo का नाम बदलें:

             wedding-couple-photo.jpeg
        ========================================== -->

        <div class="intro-photo-frame">

            <div class="intro-photo-inner">

                <img
                    src="wedding-couple-photo.jpeg"
                    alt="Mansi & Dr. Nishu"
                    class="intro-couple-photo">

            </div>

        </div>


        <!-- Couple Name -->

        <div class="intro-name-panel">

            <div class="intro-name">
                MANSI
            </div>


            <div class="intro-weds">
                Weds
            </div>


            <div class="intro-name intro-groom">
                DR. NISHU
            </div>

        </div>


        <!-- Bottom decoration -->

        <div class="intro-bottom-decoration">

            <span>✿</span>

            <span>❀</span>

            <span>✿</span>

        </div>

    </div>



    <!-- =============================================
         COUNTDOWN
         यह आपका पुराना countdown है
    ============================================== -->

    <div class="hero-countdown">


        <div class="hero-countdown-title">

            <span>
                THE WEDDING DAY
            </span>

        </div>


        <p class="hero-date">
            THURSDAY, 26TH NOVEMBER 2026
        </p>



        <div class="countdown-grid">


            <div class="time-box">

                <span id="days">
                    00
                </span>

                <small>
                    DAYS
                </small>

            </div>


            <div class="time-heart">
                ♥
            </div>


            <div class="time-box">

                <span id="hours">
                    00
                </span>

                <small>
                    HOURS
                </small>

            </div>


            <div class="time-heart">
                ♥
            </div>


            <div class="time-box">

                <span id="mins">
                    00
                </span>

                <small>
                    MINUTES
                </small>

            </div>


            <div class="time-heart">
                ♥
            </div>


            <div class="time-box">

                <span id="secs">
                    00
                </span>

                <small>
                    SECONDS
                </small>

            </div>


        </div>



        <!-- WEDDING DAY MESSAGE -->

        <div
            id="weddingDayMessage"
            class="wedding-day-message">


            <div class="message-heart">
                ♥
            </div>


            <div class="arrived-text">
                THE DAY HAS ARRIVED
            </div>


            <h3>
                Happy Wedding Day!
            </h3>


            <p>
                Two Hearts, One Beautiful Beginning
            </p>


        </div>



        <div class="hero-scroll">

            <span>
                SCROLL TO EXPLORE
            </span>

            <i class="fa-solid fa-chevron-down"></i>

        </div>


    </div>

</section>
