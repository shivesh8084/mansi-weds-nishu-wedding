<!-- =================================================
     HERO / WEDDING INTRO
================================================== -->

<section class="hero-section">

    <!-- =================================================
         ROYAL WEDDING INTRO DESIGN
         PHOTO CHANGE:
         wedding-couple-photo.jpeg
         ko apni photo ke naam se replace karein
    ================================================== -->

    <div class="wedding-intro-design">

        <!-- TOP DECORATION -->

        <div class="intro-top-decoration">

            <div class="intro-flower-left">
                ❀
            </div>

            <div class="intro-flower-right">
                ❀
            </div>

        </div>


        <!-- GANESH -->

        <div class="intro-ganesh">

            <div class="ganesh-decoration-line"></div>

            <div class="ganesh-symbol">
                ॐ
            </div>

            <div class="ganesh-decoration-line"></div>

        </div>


        <!-- GANESH TEXT -->

        <div class="intro-ganesh-text">
            ॥ SHRI GANESHAYA NAMAH ॥
        </div>


        <!-- INVITATION TEXT -->

        <div class="intro-invite-text">
            YOU ARE INVITED TO THE WEDDING OF
        </div>


        <!-- =================================================
             PHOTO FRAME
             YAHAN APNI PHOTO LAGAYEIN
        ================================================== -->

        <div class="intro-photo-frame">

            <div class="intro-photo-inner">

                <img
                    src="wedding-couple-photo.jpeg"
                    alt="Mansi & Dr. Nishu"
                    class="intro-couple-photo">

            </div>

        </div>


        <!-- =================================================
             COUPLE NAME
        ================================================== -->

        <div class="intro-name-panel">

            <div class="intro-name">
                MANSI
            </div>

            <div class="intro-weds">
                Weds
            </div>

            <div class="intro-name intro-groom">
                DR. NISHU
            </div>

        </div>


        <!-- BOTTOM FLOWERS -->

        <div class="intro-bottom-decoration">

            <span>✦</span>
            <span>❀</span>
            <span>✦</span>

        </div>

    </div>


    <!-- =================================================
         THE WEDDING DAY
================================================== -->

    <div class="hero-countdown">

        <div class="hero-countdown-title">

            <span>
                THE WEDDING DAY
            </span>

        </div>


        <p class="hero-date">
            THURSDAY, 26TH NOVEMBER 2026
        </p>


        <!-- COUNTDOWN -->

        <div class="countdown-grid">


            <div class="time-box">

                <span id="days">
                    00
                </span>

                <small>
                    DAYS
                </small>

            </div>


            <div class="time-heart">
                ♥
            </div>


            <div class="time-box">

                <span id="hours">
                    00
                </span>

                <small>
                    HOURS
                </small>

            </div>


            <div class="time-heart">
                ♥
            </div>


            <div class="time-box">

                <span id="mins">
                    00
                </span>

                <small>
                    MINUTES
                </small>

            </div>


            <div class="time-heart">
                ♥
            </div>


            <div class="time-box">

                <span id="secs">
                    00
                </span>

                <small>
                    SECONDS
                </small>

            </div>

        </div>


        <!-- WEDDING DAY MESSAGE -->

        <div
            id="weddingDayMessage"
            class="wedding-day-message">

            <div class="message-heart">
                ♥
            </div>

            <div class="arrived-text">
                THE DAY HAS ARRIVED
            </div>

            <h3>
                Happy Wedding Day!
            </h3>

            <p>
                Two Hearts, One Beautiful Beginning
            </p>

        </div>


        <!-- SCROLL -->

        <div class="hero-scroll">

            <span>
                SCROLL TO EXPLORE
            </span>

            <i class="fa-solid fa-chevron-down"></i>

        </div>

    </div>

</section>
