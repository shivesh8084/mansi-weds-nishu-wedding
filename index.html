<!-- ================= WELCOME SCREEN ================= -->

<div
    id="welcomeOverlay"
    class="welcome-overlay"
    onclick="openInvitation()"
>

    <!-- Ganesh Ji Background -->
    <div class="welcome-overlay-bg"></div>

    <!-- Welcome Content -->
    <div class="welcome-content">

        <div class="god-text">
            ॥ श्री गणेशाय नमः ॥
        </div>

        <div class="website-tag">
            THE WEDDING WEBSITE
        </div>

        <h1 class="welcome-couple">
            Mansi
            <span>Weds</span>
            Dr. Nishu
        </h1>

        <div class="ornament">
            ❖ ❖ ❖
        </div>

        <div class="tap-open-btn">
            <i class="fa-solid fa-heart"></i>
            <span>TAP TO OPEN</span>
        </div>

        <p class="tap-hint">
            Open our wedding invitation
        </p>

    </div>

</div>


<!-- ================= BACKGROUND MUSIC ================= -->

<audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
</audio>


<!-- ================= MUSIC BUTTON ================= -->

<button
    type="button"
    class="music-btn"
    onclick="toggleMusic(event)"
    aria-label="Toggle music"
>

    <i
        class="fa-solid fa-music"
        id="musicIcon"
    ></i>

</button>


<!-- ================= HERO / FIRST PAGE ================= -->

<section class="hero-section">

    <div class="hero-design">

        <!-- Main Wedding Hero Image -->
        <img
            src="hero.jpeg"
            alt="Mansi and Dr. Nishu Wedding Invitation"
            class="hero-image"
        >


        <!-- ================= LIVE COUNTDOWN ================= -->

        <div class="live-countdown">

            <div class="live-time-box">
                <span id="days">00</span>
                <small>DAYS</small>
            </div>

            <div class="live-time-heart">♥</div>


            <div class="live-time-box">
                <span id="hours">00</span>
                <small>HOURS</small>
            </div>

            <div class="live-time-heart">♥</div>


            <div class="live-time-box">
                <span id="mins">00</span>
                <small>MINUTES</small>
            </div>

            <div class="live-time-heart">♥</div>


            <div class="live-time-box">
                <span id="secs">00</span>
                <small>SECONDS</small>
            </div>

        </div>


        <!-- ================= WEDDING DAY MESSAGE ================= -->

        <div
            id="weddingDayMessage"
            class="wedding-day-message"
        >

            <div class="message-heart">
                ♥
            </div>

            <div class="arrived-text">
                THE DAY HAS ARRIVED
            </div>

            <h3>
                Happy Wedding Day!
            </h3>

            <p>
                Two Hearts, One Beautiful Beginning
            </p>

        </div>


        <!-- ================= SCROLL ================= -->

        <div class="hero-scroll">

            <span>
                SCROLL TO EXPLORE
            </span>

            <i class="fa-solid fa-chevron-down"></i>

        </div>

    </div>

</section>
